[tool.uv.workspace]
members = ["services/api", "data/generator"]

[tool.uv]
default-groups = ["dev", "data"]

[dependency-groups]
data = ["dbt-postgres>=1.9"]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "sqlfluff>=3.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps", "notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "generator", "migrate", "set_passwords", "conftest"]

[tool.mypy]
python_version = "3.12"
files = ["services/api/app", "data/sql/migrate.py", "data/sql/apply_security.py", "data/sql/set_passwords.py", "data/sql/record_run.py", "data/generator/generator", "data/dbt/run.py"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests", "data/sql/tests", "data/generator/tests"]
pythonpath = ["data/sql"]
addopts = "--import-mode=importlib"

[tool.sqlfluff.core]
dialect = "postgres"
templater = "jinja"
max_line_length = 100
# ST06 (column order) fights readable dbt models; AM04 flags the dbt-style `select *` from CTEs.
exclude_rules = ["ST06", "AM04"]

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"
