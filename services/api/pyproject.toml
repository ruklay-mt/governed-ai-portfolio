[project]
name = "harbourline-api"
version = "0.1.0"
description = "FastAPI backend for the Governed AI Data Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "voyageai>=0.5.0",
    "pyyaml>=6.0.3",
    "sqlglot>=30.25.0",
    "psycopg-pool>=3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
