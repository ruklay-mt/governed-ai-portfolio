[project]
name = "harbourline-generator"
version = "0.1.0"
description = "Seeded synthetic data generator for Harbourline Supply Co. (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]
