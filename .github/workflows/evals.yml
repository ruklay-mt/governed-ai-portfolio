name: evals

# Eval gate (spec §12, ADR 0012): run the golden set against the live agent on Neon `dev` for
# every PR that can change answers, and fail when a threshold in evals/config.yml is missed.
# It spends real tokens (about US$0.45 a run), so it only runs when these paths change; the
# run stops at max_cost_usd, and the CI Anthropic key has its own spend limit.
on:
  pull_request:
    paths:
      - services/api/app/agent/**
      - services/api/app/semantic/**
      - services/api/app/retrieval/**
      - services/api/app/evals/**
      - evals/**
      - .github/workflows/evals.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
      AGENT_DB_PASSWORD_SALES_REP_NZ_SOUTH: ${{ secrets.AGENT_DB_PASSWORD_SALES_REP_NZ_SOUTH }}
      AGENT_DB_PASSWORD_SALES_MANAGER: ${{ secrets.AGENT_DB_PASSWORD_SALES_MANAGER }}
      AGENT_DB_PASSWORD_FINANCE: ${{ secrets.AGENT_DB_PASSWORD_FINANCE }}
      AGENT_DB_PASSWORD_SUPPORT: ${{ secrets.AGENT_DB_PASSWORD_SUPPORT }}
      APP_SERVICE_DB_PASSWORD: ${{ secrets.APP_SERVICE_DB_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CI }}
      MODEL_MAIN: ${{ vars.MODEL_MAIN }}
      MODEL_SMALL: ${{ vars.MODEL_SMALL }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      # Fail early, and by name, when a required secret or variable is missing. The gate must
      # never pass by skipping: no credentials means a red check, not a green one.
      - name: Check required secrets and variables
        run: |
          missing=""
          for name in DATABASE_URL AGENT_DB_PASSWORD_SALES_REP_NZ_SOUTH AGENT_DB_PASSWORD_SALES_MANAGER \
            AGENT_DB_PASSWORD_FINANCE AGENT_DB_PASSWORD_SUPPORT APP_SERVICE_DB_PASSWORD \
            ANTHROPIC_API_KEY MODEL_MAIN MODEL_SMALL VOYAGE_API_KEY EMBEDDING_MODEL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets/variables:$missing (ANTHROPIC_API_KEY comes from secret ANTHROPIC_API_KEY_CI; DATABASE_URL from DATABASE_URL_DEV)"
            exit 1
          fi
      - run: make setup-py
      # Applies any migration in this PR to Neon dev (the same branch the daily pipeline uses).
      - run: make db-migrate
      - run: make eval

      - name: Report in the job summary
        if: always()
        run: |
          report=$(ls -t evals/reports/*.md 2>/dev/null | head -1)
          if [ -n "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/
          if-no-files-found: ignore
