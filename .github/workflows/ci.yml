name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio
      # Throwaway passwords for the CI-only database container.
      AGENT_DB_PASSWORD_SALES_REP_NZ_SOUTH: ci-sales-rep
      AGENT_DB_PASSWORD_SALES_MANAGER: ci-sales-manager
      AGENT_DB_PASSWORD_FINANCE: ci-finance
      AGENT_DB_PASSWORD_SUPPORT: ci-support
      APP_SERVICE_DB_PASSWORD: ci-app-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: make setup-py
      - run: make lint-py
      - run: make db-migrate
      - run: make data-generate SCALE=small
      - run: make dbt-build
      - run: make db-users
      - run: make test-py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make setup-web
      - run: make lint-web
      - run: make test-web
      - run: pnpm --filter web build

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/api.Dockerfile -t api:ci .
