name: deploy

on:
  push:
    branches: [main]
    paths:
      - services/api/**
      - infra/api.Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation: no long-lived keys (ADR 0002)

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SERVICE: api
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/api:${{ github.sha }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -f infra/api.Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --set-secrets DATABASE_URL=database-url:latest \
            --min-instances 0 \
            --max-instances 2 \
            --timeout 300 \
            --port 8080 \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl --fail --silent --show-error --max-time 60 "$url/api/health"
